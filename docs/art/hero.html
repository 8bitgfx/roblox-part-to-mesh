<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="base.css">
<style>body{width:1600px;height:1000px}h1{position:absolute;left:72px;top:64px;font-size:124px;max-width:13ch}</style></head><body>
<canvas id="c" width="1600" height="1000"></canvas>
<h1>Many parts in. One mesh out.</h1>
<div class="cap" id="a" style="left:72px;top:872px"></div>
<div class="cap" id="b" style="left:930px;top:872px"></div>
<script src="iso.js"></script><script>
const pal={stone:'#9AA0A6',brick:'#E5392A',glass:'#7FB2FF',roof:'#2F6BFF',trunk:'#8A5A2B',leaf:'#3DBE5B'};
const ctx=c.getContext('2d');
ISO.draw(ctx,{mode:'parts',s:29,ox:400,oy:600,explodeXY:.16,explodeZ:.45,palette:pal,outline:'#17140F',lw:1.5,studs:true});
ctx.strokeStyle='#17140F';ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';
ctx.beginPath();ctx.moveTo(735,650);ctx.lineTo(875,650);ctx.moveTo(840,612);ctx.lineTo(878,650);ctx.lineTo(840,688);ctx.stroke();
ISO.draw(ctx,{mode:'mesh',s:38,ox:1230,oy:540,palette:pal,wire:'#17140F',wlw:2.4,studs:true});
const st=ISO.stats(),q=ISO.quads();
a.innerHTML=st.parts+' Parts<span>one per brick in this example</span>';
b.innerHTML='1 MeshPart<span>'+q+' faces after merging, studs baked in</span>';
document.title='ok';
</script></body></html>
