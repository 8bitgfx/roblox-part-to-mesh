<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="base.css">
<style>body{width:1600px;height:680px}
.p{position:absolute;width:460px}
.p b{display:block;font:800 44px/1 var(--display);letter-spacing:-.03em;margin-bottom:12px}
.p span{display:block;font:400 26px/1.35 var(--text)}
.p i{display:block;font:800 56px/1 var(--display);font-style:normal;letter-spacing:-.03em;margin-bottom:16px}
body.phone{width:800px;height:1500px}body.phone .p{width:330px}body.phone .p b{font-size:46px}body.phone .p span{font-size:34px}</style></head><body>
<canvas id="c"></canvas>
<div class="p" id="p1"><i>1</i><b>Drop touching faces</b><span>Where two parts meet, both faces go.</span></div>
<div class="p" id="p2"><i>2</i><b>Merge flat runs</b><span>Same colour, same plane: one face.</span></div>
<div class="p" id="p3"><i>3</i><b>Bake the studs</b><span>Studs become texture, not geometry.</span></div>
<script src="iso.js"></script><script>
const PHONE=location.hash==='#phone';if(PHONE)document.body.className='phone';
// panel origins: desktop = 3 columns, phone = 3 rows (art left, text right)
const D=PHONE?[[0,0],[0,500],[0,1000]]:[[0,0],[512,0],[1024,0]];
const W=PHONE?800:1600,H=PHONE?1500:680;c.width=W;c.height=H;
const txt=PHONE?(i)=>[430,D[i][1]+110]:(i)=>[D[i][0]+72,470];
[p1,p2,p3].forEach((el,i)=>{const [x,y]=txt(i);el.style.left=x+'px';el.style.top=y+'px';});
if(!PHONE)[p1,p2,p3].forEach(el=>{el.querySelector('i').style.cssText='position:absolute;top:-414px';});
const ctx=c.getContext('2d');
const vox=(arr)=>{const m=new Map();arr.forEach(([x,y,z,c])=>m.set(x+','+y+','+z,{x,y,z,c}));return m};
const pal={a:'#E5392A',b:'#2F6BFF'};
const sc=PHONE?.82:1;
// 1
{const [dx,dy]=D[0];const s=110*sc,ox=dx+(PHONE?120:230),oy=dy+(PHONE?170:170);
ISO.draw(ctx,{voxels:vox([[0,0,0,'a'],[1,0,0,'b']]),mode:'parts',s,ox,oy,explodeXY:1,palette:pal,outline:'#17140F',lw:3,studs:true});
const P=(x,y,z)=>[ox+(x-y)*s*.866,oy+(x+y)*s*.5-z*s];const f=[P(1,0,1),P(1,1,1),P(1,1,0),P(1,0,0)];
const m=[(f[0][0]+f[2][0])/2,(f[0][1]+f[2][1])/2];ctx.strokeStyle='#17140F';ctx.lineWidth=8;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(m[0]-26,m[1]-26);ctx.lineTo(m[0]+26,m[1]+26);ctx.moveTo(m[0]+26,m[1]-26);ctx.lineTo(m[0]-26,m[1]+26);ctx.stroke();}
// 2
{const [dx,dy]=D[1];const s=72*sc,ox=dx+(PHONE?175:250),oy=dy+(PHONE?150:190);
const slab=[];for(let x=0;x<4;x++)for(let y=0;y<3;y++)slab.push([x,y,0,'b']);
ISO.draw(ctx,{voxels:vox(slab),mode:'mesh',s,ox,oy,palette:pal,wire:'#17140F',wlw:3,studs:true});
const Q=(x,y,z)=>[ox+(x-y)*s*.866,oy+(x+y)*s*.5-z*s];ctx.strokeStyle='rgba(23,20,15,.3)';ctx.lineWidth=2;ctx.setLineDash([7,7]);
ctx.beginPath();for(let x=1;x<4;x++){ctx.moveTo(...Q(x,0,1));ctx.lineTo(...Q(x,3,1));}for(let y=1;y<3;y++){ctx.moveTo(...Q(0,y,1));ctx.lineTo(...Q(4,y,1));}ctx.stroke();ctx.setLineDash([]);}
// 3
{const [dx,dy]=D[2];const s=(PHONE?120:100)*sc;
ISO.draw(ctx,{voxels:vox([[0,0,0,'a']]),mode:'parts',s,ox:dx+(PHONE?110:210),oy:dy+(PHONE?130:210),palette:pal,outline:'#17140F',lw:3,studs:true});
ISO.draw(ctx,{voxels:vox([[0,0,0,'a']]),mode:'mesh',s,ox:dx+(PHONE?250:390),oy:dy+(PHONE?250:300),palette:pal,wire:'#17140F',wlw:3,studs:true});}
</script></body></html>
